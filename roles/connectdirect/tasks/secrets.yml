---
# Requires GitHub runner or target node to have gcloud authenticated with Secret Manager access.
# Preferred model: GitHub Actions authenticates to GCP using Workload Identity Federation.

- name: Read Connect:Direct keystore password from GCP Secret Manager
  ansible.builtin.command:
    cmd: >-
      gcloud secrets versions access latest
      --project={{ gcp_project_id }}
      --secret={{ connectdirect_secret_keystore_password }}
  register: cd_keystore_password_result
  changed_when: false
  no_log: true
  delegate_to: localhost
  run_once: true

- name: Read Connect:Direct certificate password from GCP Secret Manager
  ansible.builtin.command:
    cmd: >-
      gcloud secrets versions access latest
      --project={{ gcp_project_id }}
      --secret={{ connectdirect_secret_cert_password }}
  register: cd_cert_password_result
  changed_when: false
  no_log: true
  delegate_to: localhost
  run_once: true

- name: Set Connect:Direct secret facts
  ansible.builtin.set_fact:
    connectdirect_keystore_password: "{{ cd_keystore_password_result.stdout }}"
    connectdirect_cert_password: "{{ cd_cert_password_result.stdout }}"
  no_log: true
